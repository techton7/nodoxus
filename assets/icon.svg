<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- 1. 주황색 스트림 전용 마스크 (3D 교차 틈새 + 주황 노드 도넛 구멍) -->
    <mask id="orange-mask">
      <rect width="256" height="256" fill="white" />
      <!-- 중앙 파란선 교차 틈새 (선폭 22px + 여백 8px*2 = 38px) -->
      <path 
        d="M 68 56 C 68 115, 115 128, 128 128 C 141 128, 188 141, 188 200" 
        fill="none" 
        stroke="black" 
        stroke-width="38" 
        stroke-linecap="round" 
      />
      <!-- 우상단 노드 도넛 구멍 (반지름 13px) -->
      <circle cx="188" cy="56" r="13" fill="black" />
      <!-- 좌하단 노드 도넛 구멍 (반지름 13px) -->
      <circle cx="68" cy="200" r="13" fill="black" />
    </mask>

    <!-- 2. 파란색 스트림 전용 마스크 (파란 노드 도넛 구멍) -->
    <mask id="blue-mask">
      <rect width="256" height="256" fill="white" />
      <!-- 좌상단 노드 도넛 구멍 (반지름 13px) -->
      <circle cx="68" cy="56" r="13" fill="black" />
      <!-- 우하단 노드 도넛 구멍 (반지름 13px) -->
      <circle cx="188" cy="200" r="13" fill="black" />
    </mask>
  </defs>

  <!-- 1. 주황색 스트림 (Dioxus Rust Orange, #F05624) -->
  <g mask="url(#orange-mask)" fill="#F05624">
    <!-- 연결 케이블 (두께 22px) -->
    <path 
      d="M 188 56 C 188 115, 141 128, 128 128 C 115 128, 68 141, 68 200" 
      fill="none" 
      stroke="#F05624" 
      stroke-width="22" 
      stroke-linecap="round" 
    />
    <!-- 우상단 노드 (외경 35px - 내경 13px = 테두리 두께 22px) -->
    <circle cx="188" cy="56" r="35" />
    <!-- 좌하단 노드 (외경 35px - 내경 13px = 테두리 두께 22px) -->
    <circle cx="68" cy="200" r="35" />
  </g>

  <!-- 2. 파란색 스트림 (Dioxus Cyan Blue, #0EA5E9) -->
  <g mask="url(#blue-mask)" fill="#0EA5E9">
    <!-- 연결 케이블 (두께 22px) -->
    <path 
      d="M 68 56 C 68 115, 115 128, 128 128 C 141 128, 188 141, 188 200" 
      fill="none" 
      stroke="#0EA5E9" 
      stroke-width="22" 
      stroke-linecap="round" 
    />
    <!-- 좌상단 노드 (외경 35px - 내경 13px = 테두리 두께 22px) -->
    <circle cx="68" cy="56" r="35" />
    <!-- 우하단 노드 (외경 35px - 내경 13px = 테두리 두께 22px) -->
    <circle cx="188" cy="200" r="35" />
  </g>
</svg>